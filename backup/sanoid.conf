# Install to /etc/sanoid/sanoid.conf on the Proxmox host, then enable the
# sanoid timer. Snapshots cover mistakes and ransomware; they do not cover the
# machine dying, which is what the rclone job is for.

[tank/garage-meta]
    use_template = production
    recursive = no

[tank/garage-data]
    use_template = production
    recursive = no

[tank/postgres]
    # Postgres gets more frequent snapshots than the objects: it is small, and
    # it is the only place album rules, ratings and permissions live. Objects
    # are large and, apart from originals, regenerable.
    use_template = database
    recursive = no

[template_production]
    frequently = 0
    hourly = 24
    daily = 30
    weekly = 4
    monthly = 6
    yearly = 0
    autosnap = yes
    autoprune = yes

[template_database]
    frequently = 4
    hourly = 48
    daily = 30
    weekly = 8
    monthly = 12
    yearly = 1
    autosnap = yes
    autoprune = yes
